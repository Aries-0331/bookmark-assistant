name: Publish Core Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - packages/contracts/**
      - packages/extension-core/**
      - packages/server-core/**
      - scripts/check-core-package-runtime.js
      - scripts/publish-core-packages.js
      - pnpm-lock.yaml

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @bookmark-assistant core packages
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build workspace
        run: pnpm build:all

      - name: Validate package runtime
        run: pnpm check:core-runtime

      - name: Publish core packages
        run: pnpm publish:core -- --yes
